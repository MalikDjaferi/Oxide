# Configuration for building the Oxide bare-metal x86_64 kernel.
[unstable]

# Cargo needs this to allow the workspace package to consume
# the kernel binary as a build dependency artifact.
bindeps = true

[target.x86_64-unknown-none]

# Use Oxide's custom linker script.
#
# The absolute path is generated by Cargo's environment, so we use
# the workspace-relative path through the linker argument below.
rustflags = [
    "-C",
    "link-arg=-T/home/malikdjaferi/Oxide/kernel/linker.ld"
]