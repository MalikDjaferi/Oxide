[workspace]
resolver = "3"

# Oxide currently consists of the kernel crate.
#
# Additional kernel subsystems will eventually become separate crates for:
#
# - memory management
# - drivers
# - filesystem support
# - process management
# - userspace
members = ["kernel"]

# ----------------------------------------------------------------------------
# ROOT PACKAGE
# ----------------------------------------------------------------------------
#
# The root package is used to assemble the final Oxide boot image.
#
# It is NOT the operating-system kernel itself.
#
# The actual bare-metal kernel lives in:
#
#     kernel/
#
# Keeping this distinction means Cargo does not try to compile the root
# package as an x86_64-unknown-none executable.
# ----------------------------------------------------------------------------

[package]
name = "oxide"
version = "0.1.0"
edition = "2024"

# The build script assembles the kernel into the final bootable ISO.
build = "build.rs"

[build-dependencies]